<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S.O.Sangue</title>
    <link rel="shortcut icon" href="icon.png" type="image/x-icon">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav>
        <img src="icon2.png" alt="Logo do S.O.Sangue" style="height: 60px; margin-left: 20px;">
        <a class="nav-link" href="index.html">Home</a>
        <a class="nav-link" href="doe_agora_doador.html">Doe Agora</a>
        <a class="nav-link" href="profile.html">Perfil</a>
    </nav>

    <div class="container-fluid main-wrapper">
        <div class="row h-100">
            <!-- Coluna do Mapa (Esquerda) -->
            <div class="col-md-8 col-12 p-0 position-relative">
                <div id="map"></div>

                <!-- Quick Info Overlay -->
                <div class="info-overlay" id="hospital-info">
                    <div class="info-card">
                        <h3>Selecione um hospital</h3>
                        <p class="distance">Escolha uma opção na lista ao lado ou no mapa.</p>
                        <div class="blood-needs">
                            <!-- Tags serão inseridas via JS -->
                        </div>
                        <button class="btn-outline">Ver Rota</button>
                    </div>
                </div>
            </div>

            <!-- Coluna das Cidades (Direita) -->
            <div name="cidades" class="col-md-4 col-12 sidebar-right py-3 px-4">
                <h4 class="mb-4">Locais de Coleta</h4>
                <div class="accordion accordion-flush" id="accordionFlushExample">
                    <!-- Americana -->
                    <div class="accordion-item">
                        <h2 class="accordion-header">
                            <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
                                data-bs-target="#flush-collapseOne">
                                Americana
                            </button>
                        </h2>
                        <div id="flush-collapseOne" class="accordion-collapse collapse"
                            data-bs-parent="#accordionFlushExample">
                            <div class="accordion-body">
                                <select class="form-select">
                                    <option value="" selected disabled>Selecione um local</option>
                                    <option value="americana1">Centro de Hematologia Americana</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <!-- Campinas -->
                    <div class="accordion-item">
                        <h2 class="accordion-header">
                            <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
                                data-bs-target="#flush-collapseTwo">
                                Campinas
                            </button>
                        </h2>
                        <div id="flush-collapseTwo" class="accordion-collapse collapse"
                            data-bs-parent="#accordionFlushExample">
                            <div class="accordion-body">
                                <select class="form-select">
                                    <option value="" selected disabled>Selecione um local</option>
                                    <option value="campinas1">Hemocentro Unicamp</option>
                                    <option value="campinas2">Hemocentro Amoreiras (CDO)</option>
                                    <option value="campinas3">Pulsa São Paulo – Campinas</option>
                                    <option value="campinas4">Laboratório Fleury Campinas</option>
                                    <option value="campinas5">Laboratório Confiance – Taquaral</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <!-- Hortolândia -->
                    <div class="accordion-item">
                        <h2 class="accordion-header">
                            <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
                                data-bs-target="#flush-collapseThree">
                                Hortolândia
                            </button>
                        </h2>
                        <div id="flush-collapseThree" class="accordion-collapse collapse"
                            data-bs-parent="#accordionFlushExample">
                            <div class="accordion-body">
                                <select class="form-select">
                                    <option value="" selected disabled>Selecione um local</option>
                                    <option value="hortolandia1">Laboratório DMS Burnier Hortolândia</option>
                                    <option value="hortolandia2">Laboratório Samuel Pessoa</option>
                                    <option value="hortolandia3">Laboratório Sete Mais</option>
                                    <option value="hortolandia4">Laboratório Confiance – Hortolândia</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <!-- Sumaré -->
                    <div class="accordion-item">
                        <h2 class="accordion-header">
                            <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
                                data-bs-target="#flush-collapseFour">
                                Sumaré
                            </button>
                        </h2>
                        <div id="flush-collapseFour" class="accordion-collapse collapse"
                            data-bs-parent="#accordionFlushExample">
                            <div class="accordion-body">
                                <select class="form-select">
                                    <option value="" selected disabled>Selecione um local</option>
                                    <option value="sumare1">Laboratório Confiance – Sumaré Centro</option>
                                    <option value="sumare2">Laboratório DMS Burnier Sumaré</option>
                                    <option value="sumare3">Hemocentro Sumaré (Hospital Estadual)</option>
                                    <option value="sumare4">Laboratório Rebouças</option>
                                    <option value="sumare5">Laboratório Microlab Diagnósticos</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="main.js"></script>
</body>

</html>
